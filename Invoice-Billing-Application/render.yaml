services:
  - type: web
    name: swiftlab-backend
    env: docker
    plan: standard
    dockerContext: .
    dockerfilePath: Invoice-Billing-Application/Dockerfile
    healthCheckPath: /api/auth/profile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        value: postgres
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
