spring.application.name=swiftlab-inventory-billing
spring.profiles.default=local

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
java.awt.headless=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

app.device.name=${APP_DEVICE_NAME:SwiftLab Device}
app.cloud.api-url=${APP_CLOUD_API_URL:}
app.supabase.url=${SUPABASE_URL:}
app.supabase.anon-key=${SUPABASE_ANON_KEY:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
