<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout (~{::title}, ~{::#main-content})}">
<head>
    <title th:text="${pageTitle} + ' - ' + ${settings.appTitle}">Create Invoice</title>
</head>
<body>
<div id="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.5rem; font-weight: 800;" th:text="${pageTitle}">Create New Invoice</h2>
        <a th:href="@{/invoices}" class="btn btn-secondary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back to List
        </a>
    </div>

    <form th:action="@{/invoices/save}" th:object="${invoice}" method="post" id="invoice-form">
        <input type="hidden" th:field="*{id}" />
        <input type="hidden" th:field="*{userId}" />
        <input type="hidden" th:field="*{generatedAt}" />
        <input type="hidden" th:field="*{synced}" />
        <input type="hidden" th:field="*{supabaseId}" />

        <div class="card">
            <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--primary);">1. Invoice General Information</h3>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Invoice Number *</label>
                    <input type="text" th:field="*{invoiceNumber}" class="form-control" placeholder="e.g. INV-2026-001" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Issue Date *</label>
                    <input type="date" th:field="*{issueDate}" class="form-control" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Due Date *</label>
                    <input type="date" th:field="*{dueDate}" class="form-control" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Payment Terms</label>
                    <input type="text" th:field="*{paymentTerms}" class="form-control" placeholder="e.g. Net 15 Days (leave blank to omit)" />
                    <small style="color: var(--text-muted); font-size: 0.75rem;">If empty, terms won't appear on invoice/PDF</small>
                </div>
                <div class="form-group">
                    <label class="form-label">Payment Status</label>
                    <select th:field="*{status}" class="form-control">
                        <option value="PENDING">PENDING</option>
                        <option value="PAID">PAID</option>
                        <option value="OVERDUE">OVERDUE</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1.25rem; color: var(--primary);">2. Customer &amp; Billing Details</h3>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Customer / Company Name *</label>
                    <input type="text" th:field="*{customerName}" class="form-control" placeholder="Client Name or Business" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Customer Email</label>
                    <input type="email" th:field="*{customerEmail}" class="form-control" placeholder="client@example.com" />
                </div>
                <div class="form-group">
                    <label class="form-label">Customer Phone</label>
                    <input type="text" th:field="*{customerPhone}" class="form-control" placeholder="+91 98765 43210 or +1 (555) 000-0000" />
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">Billing Address</label>
                <textarea th:field="*{customerAddress}" class="form-control" rows="2" placeholder="Street Address, City, State, ZIP"></textarea>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
                <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0; color: var(--primary);">3. Products &amp; Line Items</h3>
                <button type="button" class="btn btn-secondary btn-sm" onclick="addItemRow()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Line Item
                </button>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Item Description *</th>
                        <th style="width: 110px;">Qty</th>
                        <th style="width: 170px;" th:text="'Unit Price (' + ${settings.currencySymbol} + ') *'">Unit Price</th>
                        <th style="width: 140px; text-align: right;" th:text="'Total (' + ${settings.currencySymbol} + ')'">Total</th>
                        <th style="width: 50px; text-align: center;"></th>
                    </tr>
                    </thead>
                    <tbody id="invoice-items-body">
                    <tr th:each="item, stat : *{items}" class="item-row">
                        <td>
                            <input type="text" th:field="*{items[__${stat.index}__].description}" class="form-control item-desc" placeholder="Item / Service description" required />
                        </td>
                        <td style="width: 110px;">
                            <input type="number" th:field="*{items[__${stat.index}__].quantity}" class="form-control item-qty" min="1" step="1" required />
                        </td>
                        <td style="width: 170px;">
                            <input type="number" th:field="*{items[__${stat.index}__].unitPrice}" class="form-control item-price" min="0" step="0.01" required />
                        </td>
                        <td style="width: 140px; text-align: right; font-weight: 600;" class="item-line-total" th:text="${settings.currencySymbol} + ${#numbers.formatDecimal(item.total, 1, 2)}">₹0.00</td>
                        <td style="width: 50px; text-align: center;">
                            <button type="button" class="btn btn-danger btn-sm" onclick="removeItemRow(this)" title="Remove item">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 340px; gap: 2rem; margin-top: 2rem;">
                <div>
                    <div class="form-group">
                        <label class="form-label">Notes &amp; Payment Terms</label>
                        <textarea th:field="*{notes}" class="form-control" rows="4" placeholder="e.g. Bank transfer info, Thank you message, or payment terms"></textarea>
                    </div>
                </div>

                <div style="background-color: var(--bg-card-hover); padding: 1.25rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                        <span style="color: var(--text-secondary);">Subtotal:</span>
                        <span id="display-subtotal" style="font-weight: 700; font-family: var(--font-mono);" th:text="${settings.currencySymbol} + '0.00'">₹0.00</span>
                    </div>

                    <div class="form-group" style="margin-bottom: 0.75rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label class="form-label" style="margin: 0;" th:text="'Discount (' + ${settings.currencySymbol} + '):'">Discount:</label>
                            <input type="number" id="discount" th:field="*{discount}" class="form-control" style="width: 110px; text-align: right;" min="0" step="0.01" />
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 0.75rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <label class="form-label" style="margin: 0;">Tax Rate (%):</label>
                            <input type="number" id="tax-rate" th:field="*{taxRate}" class="form-control" style="width: 110px; text-align: right;" min="0" step="0.1" />
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                        <span style="color: var(--text-secondary);">Tax Amount:</span>
                        <span id="display-tax" style="font-weight: 700; font-family: var(--font-mono);" th:text="${settings.currencySymbol} + '0.00'">₹0.00</span>
                    </div>

                    <hr style="border: 0; border-top: 2px solid var(--border-color); margin: 0.75rem 0;" />

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 1.1rem; font-weight: 800; color: var(--text-primary);">Grand Total:</span>
                        <span id="display-grand-total" style="font-size: 1.35rem; font-weight: 800; color: var(--primary); font-family: var(--font-mono);" th:text="${settings.currencySymbol} + '0.00'">₹0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-bottom: 3rem;">
            <a th:href="@{/invoices}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" style="padding: 0.65rem 2rem; font-size: 1rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Save Invoice
            </button>
        </div>
    </form>
</div>
</body>
</html>
