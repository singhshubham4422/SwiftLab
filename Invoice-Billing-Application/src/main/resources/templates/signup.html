<!DOCTYPE html>
<html lang="en" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Organization Account - Invoicing</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme-toggle.js}"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
            background: linear-gradient(135deg, var(--bg-body) 0%, var(--bg-card-hover) 100%);
        }
        .signup-card {
            width: 100%;
            max-width: 640px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--primary);
            color: #ffffff;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
            <button type="button" id="theme-toggle-btn" class="btn btn-secondary btn-sm" title="Toggle Light / Dark Mode">
                <span id="theme-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </span>
                <span id="theme-text">Theme</span>
            </button>
        </div>

        <div class="signup-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-badge">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                </div>
                <h1 style="font-size: 1.7rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 0.35rem;">
                    Setup Organization &amp; Account
                </h1>
                <p style="color: var(--text-secondary); font-size: 0.925rem;">
                    Configure your business profile, currency standard, and administrator credentials
                </p>
            </div>

            <div th:if="${error}" class="alert alert-error" style="margin-bottom: 1.5rem;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span th:text="${error}">Error message</span>
            </div>

            <!-- Live App Title Preview -->
            <div style="background-color: var(--bg-card-hover); border: 1px dashed var(--primary); border-radius: var(--radius-md); padding: 1rem 1.25rem; margin-bottom: 1.75rem; text-align: center;">
                <div style="font-size: 0.775rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary);">
                    Application Title Preview
                </div>
                <div id="app-title-preview" style="font-size: 1.25rem; font-weight: 800; color: var(--primary); margin-top: 0.25rem;">
                    Swift Invoicing
                </div>
            </div>

            <form th:action="@{/signup}" method="post">
                <!-- 1. Identity -->
                <div style="margin-bottom: 1.75rem;">
                    <h3 style="font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem;">
                        1. Organization &amp; User Details
                    </h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Organisation / Business Name *</label>
                            <input type="text" id="organizationName" name="organizationName" class="form-control" th:value="${organizationName}" placeholder="e.g. Swift or Acme Corp" required oninput="updateTitlePreview(this.value)" autofocus />
                        </div>

                        <div class="form-group">
                            <label class="form-label">User / Admin Full Name *</label>
                            <input type="text" id="fullName" name="fullName" class="form-control" th:value="${fullName}" placeholder="e.g. Shubham Singh" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Business Tagline / Subtitle</label>
                        <input type="text" name="tagline" class="form-control" value="Modern Enterprise Invoice Management" placeholder="e.g. Modern Enterprise Invoice Management" />
                    </div>
                </div>

                <!-- 2. Login Credentials -->
                <div style="margin-bottom: 1.75rem;">
                    <h3 style="font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem;">
                        2. Login Credentials
                    </h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Email Address *</label>
                            <input type="email" name="email" class="form-control" th:value="${email}" placeholder="admin@swiftlab.io" required />
                        </div>

                        <div class="form-group">
                            <label class="form-label">Password *</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required />
                        </div>
                    </div>
                </div>

                <!-- 3. Currency & Defaults -->
                <div style="margin-bottom: 1.75rem;">
                    <h3 style="font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--primary); margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem;">
                        3. Currency Standard &amp; Contact Info
                    </h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Select Currency Standard *</label>
                            <select name="currencySymbol" id="currencySymbol" class="form-control" onchange="syncCurrencyCode(this)">
                                <option value="₹" selected>₹ - Indian Rupee (INR)</option>
                                <option value="$">$ - US Dollar (USD)</option>
                                <option value="€">€ - Euro (EUR)</option>
                                <option value="£">£ - British Pound (GBP)</option>
                                <option value="C$">C$ - Canadian Dollar (CAD)</option>
                                <option value="A$">A$ - Australian Dollar (AUD)</option>
                                <option value="AED">AED - UAE Dirham</option>
                                <option value="¥">¥ - Japanese Yen (JPY)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Currency Code</label>
                            <input type="text" id="currencyCode" name="currencyCode" value="INR" class="form-control" readonly />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="text" name="phone" class="form-control" placeholder="+91 98765 43210 or +1 (555) 019-2834" />
                        </div>

                        <div class="form-group">
                            <label class="form-label">Registered Address</label>
                            <input type="text" name="address" class="form-control" placeholder="City, Country" />
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1.05rem; font-weight: 700;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>
                    Create Organization &amp; Start Invoicing
                </button>
            </form>

            <div th:if="${hasExistingUsers}" style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
                Already registered? 
                <a th:href="@{/login}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In here</a>
            </div>
        </div>
    </div>

    <script>
        function updateTitlePreview(val) {
            const preview = document.getElementById('app-title-preview');
            if (preview) {
                preview.textContent = val.trim() ? (val.trim() + ' Invoicing') : 'Swift Invoicing';
            }
        }
        function syncCurrencyCode(select) {
            const map = {
                '₹': 'INR',
                '$': 'USD',
                '€': 'EUR',
                '£': 'GBP',
                'C$': 'CAD',
                'A$': 'AUD',
                'AED': 'AED',
                '¥': 'JPY'
            };
            const codeInput = document.getElementById('currencyCode');
            if (codeInput && map[select.value]) {
                codeInput.value = map[select.value];
            }
        }
    </script>
</body>
</html>
