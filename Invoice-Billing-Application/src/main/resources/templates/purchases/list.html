<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Purchases - SwiftLab</title>
</head>
<body>
<div th:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0;">Purchase Orders</h1>
            <p style="color: var(--text-muted); margin: 0.25rem 0 0 0; font-size: 0.9rem;">
                Stock procurement, goods receiving, and vendor purchase logs.
            </p>
        </div>
        <a th:href="@{/purchases/new}" class="btn btn-primary btn-sm">+ New Purchase Order</a>
    </div>

    <div style="background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;">
        <table class="table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background: var(--bg-hover); text-align: left;">
                    <th style="padding: 0.75rem 1rem;">PO Number</th>
                    <th style="padding: 0.75rem 1rem;">Supplier</th>
                    <th style="padding: 0.75rem 1rem;">Warehouse</th>
                    <th style="padding: 0.75rem 1rem;">Purchase Date</th>
                    <th style="padding: 0.75rem 1rem;">Status</th>
                    <th style="padding: 0.75rem 1rem; text-align: right;">Total Amount</th>
                    <th style="padding: 0.75rem 1rem; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${purchases}" style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 0.75rem 1rem;"><a th:href="@{'/purchases/' + ${p.id}}" th:text="${p.purchaseNumber}" style="font-weight: 600; color: var(--primary);"></a></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${p.supplierName}"></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${p.warehouseName}"></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${p.purchaseDate}"></td>
                    <td style="padding: 0.75rem 1rem;">
                        <span class="badge" th:classappend="${p.status.name() == 'RECEIVED' ? 'badge-paid' : 'badge-pending'}" th:text="${p.status}"></span>
                    </td>
                    <td style="padding: 0.75rem 1rem; text-align: right; font-weight: 700;" th:text="${(settings != null ? settings.currencySymbol : '₹') + #numbers.formatDecimal(p.total, 1, 2)}"></td>
                    <td style="padding: 0.75rem 1rem; text-align: center;">
                        <a th:href="@{'/purchases/' + ${p.id}}" class="btn btn-secondary btn-sm" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(purchases)}">
                    <td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        No purchase orders recorded yet. Click "+ New Purchase Order" to procure inventory.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
