<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${pageTitle}">New Purchase - SwiftLab</title>
</head>
<body>
<div th:fragment="content">
    <div style="max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color);">
        <h2 style="margin: 0 0 1.5rem 0;" th:text="${pageTitle}">New Purchase Order</h2>

        <form th:action="@{/purchases/save}" th:object="${purchaseRequest}" method="post">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                <div>
                    <label class="form-label">Supplier / Vendor</label>
                    <select th:field="*{supplierId}" class="form-control">
                        <option value="">-- Select Supplier --</option>
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Receiving Warehouse *</label>
                    <select th:field="*{warehouseId}" required class="form-control">
                        <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Purchase Date</label>
                    <input type="date" th:field="*{purchaseDate}" class="form-control" />
                </div>
            </div>

            <!-- Items -->
            <h4 style="margin: 1.5rem 0 0.5rem 0; font-size: 1rem; font-weight: 600;">Purchased Line Items</h4>
            <div id="items-container">
                <div th:each="item, itemStat : *{items}" class="item-row" style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem;">
                    <div>
                        <label class="form-label" style="font-size: 0.75rem;">Product *</label>
                        <select th:field="*{items[__${itemStat.index}__].productId}" class="form-control">
                            <option value="">-- Select Product --</option>
                            <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' (' + p.sku + ') - Cost: ' + p.purchasePrice}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" style="font-size: 0.75rem;">Quantity *</label>
                        <input type="number" step="1" min="1" th:field="*{items[__${itemStat.index}__].quantity}" class="form-control" />
                    </div>
                    <div>
                        <label class="form-label" style="font-size: 0.75rem;">Unit Cost *</label>
                        <input type="number" step="0.01" min="0" th:field="*{items[__${itemStat.index}__].unitCost}" class="form-control" />
                    </div>
                </div>
            </div>

            <div style="margin-top: 1rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="receiveNow" th:field="*{receiveNow}" />
                <label for="receiveNow" style="font-weight: 600; cursor: pointer;">
                    Receive goods immediately (instantly increment inventory stock)
                </label>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Notes</label>
                <textarea th:field="*{notes}" rows="2" class="form-control" placeholder="Optional PO notes, tracking number, etc."></textarea>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <a th:href="@{/purchases}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Purchase Order</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
