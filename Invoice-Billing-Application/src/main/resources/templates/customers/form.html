<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${pageTitle}">Customer Form - SwiftLab</title>
</head>
<body>
<div th:fragment="content">
    <div style="max-width: 650px; margin: 0 auto; background: var(--card-bg); padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color);">
        <h2 style="margin: 0 0 1.5rem 0;" th:text="${pageTitle}">Customer Form</h2>

        <form th:action="@{/customers/save}" th:object="${customer}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div style="margin-bottom: 1rem;">
                <label class="form-label">Full Name / Business Name *</label>
                <input type="text" th:field="*{name}" required class="form-control" />
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label class="form-label">Phone Number</label>
                    <input type="text" th:field="*{phone}" class="form-control" />
                </div>
                <div>
                    <label class="form-label">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" />
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label class="form-label">Tax / GST Number</label>
                    <input type="text" th:field="*{taxNumber}" class="form-control" />
                </div>
                <div>
                    <label class="form-label">Credit Limit</label>
                    <input type="number" step="100" th:field="*{creditLimit}" class="form-control" />
                </div>
            </div>

            <div style="margin-bottom: 1rem;">
                <label class="form-label">Billing / Shipping Address</label>
                <textarea th:field="*{address}" rows="2" class="form-control"></textarea>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Internal Notes</label>
                <textarea th:field="*{notes}" rows="2" class="form-control"></textarea>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <a th:href="@{/customers}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Customer</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
