<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Sales - SwiftLab</title>
</head>
<body>
<div th:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0;">Sales Orders & POS</h1>
            <p style="color: var(--text-muted); margin: 0.25rem 0 0 0; font-size: 0.9rem;">
                Point of sale orders with immediate inventory depletion and automatic billing.
            </p>
        </div>
        <a th:href="@{/sales/new}" class="btn btn-primary btn-sm">+ New Sale Order</a>
    </div>

    <div style="background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;">
        <table class="table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background: var(--bg-hover); text-align: left;">
                    <th style="padding: 0.75rem 1rem;">Sale #</th>
                    <th style="padding: 0.75rem 1rem;">Customer</th>
                    <th style="padding: 0.75rem 1rem;">Warehouse</th>
                    <th style="padding: 0.75rem 1rem;">Date</th>
                    <th style="padding: 0.75rem 1rem;">Status</th>
                    <th style="padding: 0.75rem 1rem;">Linked Invoice</th>
                    <th style="padding: 0.75rem 1rem; text-align: right;">Total Amount</th>
                    <th style="padding: 0.75rem 1rem; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${sales}" style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 0.75rem 1rem;"><a th:href="@{'/sales/' + ${s.id}}" th:text="${s.saleNumber}" style="font-weight: 600; color: var(--primary);"></a></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${s.customerName}"></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${s.warehouseName}"></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${s.saleDate}"></td>
                    <td style="padding: 0.75rem 1rem;"><span class="badge badge-paid" th:text="${s.status}"></span></td>
                    <td style="padding: 0.75rem 1rem;">
                        <a th:if="${s.invoiceId != null}" th:href="@{'/invoices/' + ${s.invoiceId}}" th:text="${s.invoiceNumber}" style="color: var(--primary); font-family: monospace;"></a>
                    </td>
                    <td style="padding: 0.75rem 1rem; text-align: right; font-weight: 700; color: #16a34a;" th:text="${(settings != null ? settings.currencySymbol : '₹') + #numbers.formatDecimal(s.total, 1, 2)}"></td>
                    <td style="padding: 0.75rem 1rem; text-align: center;">
                        <a th:href="@{'/sales/' + ${s.id}}" class="btn btn-secondary btn-sm" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(sales)}">
                    <td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        No sales recorded yet. Click "+ New Sale Order" to make a sale.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
