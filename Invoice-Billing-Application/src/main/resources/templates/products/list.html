<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Products - SwiftLab Platform</title>
</head>
<body>
<div th:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0;">Product Catalog</h1>
            <p style="color: var(--text-muted); margin: 0.25rem 0 0 0; font-size: 0.9rem;">
                Manage items, pricing, SKU barcodes, categories, and inventory thresholds.
            </p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <a th:href="@{/products/new}" class="btn btn-primary btn-sm">+ Add Product</a>
        </div>
    </div>

    <!-- Quick Category / Brand / Unit Modals / Panels -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1.5rem;">
        <div style="background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);">
            <h4 style="margin: 0 0 0.5rem 0; font-size: 0.9rem;">Categories (<span th:text="${#lists.size(categories)}">0</span>)</h4>
            <form th:action="@{/products/category/save}" method="post" style="display: flex; gap: 0.5rem;">
                <input type="text" name="name" placeholder="New Category" required class="form-control" style="font-size: 0.8rem; padding: 0.35rem 0.5rem;">
                <button type="submit" class="btn btn-secondary btn-sm" style="white-space: nowrap;">Add</button>
            </form>
        </div>
        <div style="background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);">
            <h4 style="margin: 0 0 0.5rem 0; font-size: 0.9rem;">Brands (<span th:text="${#lists.size(brands)}">0</span>)</h4>
            <form th:action="@{/products/brand/save}" method="post" style="display: flex; gap: 0.5rem;">
                <input type="text" name="name" placeholder="New Brand" required class="form-control" style="font-size: 0.8rem; padding: 0.35rem 0.5rem;">
                <button type="submit" class="btn btn-secondary btn-sm" style="white-space: nowrap;">Add</button>
            </form>
        </div>
        <div style="background: var(--card-bg); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);">
            <h4 style="margin: 0 0 0.5rem 0; font-size: 0.9rem;">Units (<span th:text="${#lists.size(units)}">0</span>)</h4>
            <form th:action="@{/products/unit/save}" method="post" style="display: flex; gap: 0.5rem;">
                <input type="text" name="name" placeholder="Unit (e.g. Box)" required class="form-control" style="font-size: 0.8rem; padding: 0.35rem 0.5rem;">
                <input type="text" name="abbreviation" placeholder="Abbr" class="form-control" style="font-size: 0.8rem; padding: 0.35rem 0.5rem; width: 60px;">
                <button type="submit" class="btn btn-secondary btn-sm" style="white-space: nowrap;">Add</button>
            </form>
        </div>
    </div>

    <!-- Product Table -->
    <div style="background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;">
        <table class="table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background: var(--bg-hover); text-align: left;">
                    <th style="padding: 0.75rem 1rem;">SKU</th>
                    <th style="padding: 0.75rem 1rem;">Name</th>
                    <th style="padding: 0.75rem 1rem;">Category</th>
                    <th style="padding: 0.75rem 1rem; text-align: right;">Cost Price</th>
                    <th style="padding: 0.75rem 1rem; text-align: right;">Selling Price</th>
                    <th style="padding: 0.75rem 1rem; text-align: right;">Current Stock</th>
                    <th style="padding: 0.75rem 1rem; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products}" style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 0.75rem 1rem; font-family: monospace; font-weight: 600;" th:text="${p.sku}"></td>
                    <td style="padding: 0.75rem 1rem;">
                        <span th:text="${p.name}" style="font-weight: 600;"></span>
                        <div th:if="${p.barcode}" style="font-size: 0.75rem; color: var(--text-muted);" th:text="${'Barcode: ' + p.barcode}"></div>
                    </td>
                    <td style="padding: 0.75rem 1rem;" th:text="${p.categoryName != null ? p.categoryName : '-'}"></td>
                    <td style="padding: 0.75rem 1rem; text-align: right;" th:text="${(settings != null ? settings.currencySymbol : '₹') + #numbers.formatDecimal(p.purchasePrice, 1, 2)}"></td>
                    <td style="padding: 0.75rem 1rem; text-align: right; font-weight: 600; color: #16a34a;" th:text="${(settings != null ? settings.currencySymbol : '₹') + #numbers.formatDecimal(p.sellingPrice, 1, 2)}"></td>
                    <td style="padding: 0.75rem 1rem; text-align: right;">
                        <span th:class="${p.minimumStock > 0 && p.currentStock <= p.minimumStock ? 'badge badge-overdue' : 'badge badge-paid'}"
                              th:text="${p.currentStock}"></span>
                    </td>
                    <td style="padding: 0.75rem 1rem; text-align: center;">
                        <a th:href="@{'/products/edit/' + ${p.id}}" class="btn btn-secondary btn-sm" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Edit</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        No products configured yet. Click "+ Add Product" to get started.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
