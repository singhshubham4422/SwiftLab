<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${pageTitle}">Product Form - SwiftLab</title>
</head>
<body>
<div th:fragment="content">
    <div style="max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 2rem; border-radius: 8px; border: 1px solid var(--border-color);">
        <h2 style="margin: 0 0 1.5rem 0;" th:text="${pageTitle}">Add / Edit Product</h2>

        <form th:action="@{/products/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label class="form-label">Product Name *</label>
                    <input type="text" th:field="*{name}" required class="form-control" />
                </div>
                <div>
                    <label class="form-label">SKU (Stock Keeping Unit)</label>
                    <input type="text" th:field="*{sku}" placeholder="Auto-generated if empty" class="form-control" />
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label class="form-label">Barcode / UPC</label>
                    <input type="text" th:field="*{barcode}" class="form-control" />
                </div>
                <div>
                    <label class="form-label">Category</label>
                    <select th:field="*{categoryId}" class="form-control">
                        <option value="">-- Select Category --</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label class="form-label">Brand</label>
                    <select th:field="*{brandId}" class="form-control">
                        <option value="">-- Select Brand --</option>
                        <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Unit of Measure</label>
                    <select th:field="*{unitId}" class="form-control">
                        <option value="">-- Select Unit --</option>
                        <option th:each="u : ${units}" th:value="${u.id}" th:text="${u.name + ' (' + u.abbreviation + ')'}"></option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                    <label class="form-label">Purchase / Cost Price</label>
                    <input type="number" step="0.01" th:field="*{purchasePrice}" class="form-control" />
                </div>
                <div>
                    <label class="form-label">Selling Price</label>
                    <input type="number" step="0.01" th:field="*{sellingPrice}" class="form-control" />
                </div>
                <div>
                    <label class="form-label">Minimum Stock Alert</label>
                    <input type="number" step="1" th:field="*{minimumStock}" class="form-control" />
                </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label class="form-label">Description / Specifications</label>
                <textarea th:field="*{description}" rows="3" class="form-control"></textarea>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Product</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
