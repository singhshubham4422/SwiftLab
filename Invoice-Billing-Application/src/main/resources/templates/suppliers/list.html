<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Suppliers - SwiftLab</title>
</head>
<body>
<div th:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0;">Supplier Directory</h1>
            <p style="color: var(--text-muted); margin: 0.25rem 0 0 0; font-size: 0.9rem;">
                Vendors, wholesalers, and sourcing partners.
            </p>
        </div>
        <a th:href="@{/suppliers/new}" class="btn btn-primary btn-sm">+ Add Supplier</a>
    </div>

    <div style="background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;">
        <table class="table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background: var(--bg-hover); text-align: left;">
                    <th style="padding: 0.75rem 1rem;">Supplier Name</th>
                    <th style="padding: 0.75rem 1rem;">Phone</th>
                    <th style="padding: 0.75rem 1rem;">Email</th>
                    <th style="padding: 0.75rem 1rem;">Tax / GST Number</th>
                    <th style="padding: 0.75rem 1rem;">Address</th>
                    <th style="padding: 0.75rem 1rem; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${suppliers}" style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 0.75rem 1rem; font-weight: 600;" th:text="${s.name}"></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${s.phone != null ? s.phone : '-'}"></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${s.email != null ? s.email : '-'}"></td>
                    <td style="padding: 0.75rem 1rem; font-family: monospace;" th:text="${s.taxNumber != null ? s.taxNumber : '-'}"></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${s.address != null ? s.address : '-'}"></td>
                    <td style="padding: 0.75rem 1rem; text-align: center;">
                        <a th:href="@{'/suppliers/edit/' + ${s.id}}" class="btn btn-secondary btn-sm" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Edit</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(suppliers)}">
                    <td colspan="6" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        No supplier records added yet.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
