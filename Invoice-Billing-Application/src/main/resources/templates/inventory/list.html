<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Inventory Management - SwiftLab</title>
</head>
<body>
<div th:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0;">Inventory & Stock Levels</h1>
            <p style="color: var(--text-muted); margin: 0.25rem 0 0 0; font-size: 0.9rem;">
                Movement-based stock tracking across warehouse locations.
            </p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <a th:href="@{/inventory/movements}" class="btn btn-secondary btn-sm">📜 View Stock Movements</a>
        </div>
    </div>

    <!-- Stock Adjustment Section -->
    <div style="background: var(--card-bg); padding: 1.25rem; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 1.5rem;">
        <h3 style="margin: 0 0 1rem 0; font-size: 1rem; font-weight: 600;">Manual Stock Adjustment / Stock-In</h3>
        <form th:action="@{/inventory/adjust}" th:object="${adjustmentRequest}" method="post" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) 120px; gap: 0.75rem; align-items: flex-end;">
            <div>
                <label class="form-label" style="font-size: 0.75rem;">Warehouse</label>
                <select th:field="*{warehouseId}" required class="form-control" style="font-size: 0.85rem; padding: 0.4rem;">
                    <option th:each="w : ${warehouses}" th:value="${w.id}" th:text="${w.name}"></option>
                </select>
            </div>
            <div>
                <label class="form-label" style="font-size: 0.75rem;">Product</label>
                <select th:field="*{productId}" required class="form-control" style="font-size: 0.85rem; padding: 0.4rem;">
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' (' + p.sku + ')'}"></option>
                </select>
            </div>
            <div>
                <label class="form-label" style="font-size: 0.75rem;">Action</label>
                <select th:field="*{movementType}" required class="form-control" style="font-size: 0.85rem; padding: 0.4rem;">
                    <option value="STOCK_IN">STOCK IN (+)</option>
                    <option value="STOCK_OUT">STOCK OUT (-)</option>
                    <option value="ADJUSTMENT">ADJUSTMENT</option>
                    <option value="RETURN">RETURN (+)</option>
                </select>
            </div>
            <div>
                <label class="form-label" style="font-size: 0.75rem;">Quantity</label>
                <input type="number" step="1" th:field="*{quantity}" required min="1" class="form-control" style="font-size: 0.85rem; padding: 0.4rem;" />
            </div>
            <div>
                <label class="form-label" style="font-size: 0.75rem;">Reason / Notes</label>
                <input type="text" th:field="*{notes}" placeholder="e.g. Audit correction" class="form-control" style="font-size: 0.85rem; padding: 0.4rem;" />
            </div>
            <div>
                <button type="submit" class="btn btn-primary btn-sm" style="width: 100%; height: 35px;">Apply</button>
            </div>
        </form>
    </div>

    <!-- Stock Table -->
    <div style="background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;">
        <table class="table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background: var(--bg-hover); text-align: left;">
                    <th style="padding: 0.75rem 1rem;">Warehouse</th>
                    <th style="padding: 0.75rem 1rem;">SKU</th>
                    <th style="padding: 0.75rem 1rem;">Product Name</th>
                    <th style="padding: 0.75rem 1rem; text-align: right;">Quantity on Hand</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${stocks}" style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 0.75rem 1rem;" th:text="${s.warehouseName}"></td>
                    <td style="padding: 0.75rem 1rem; font-family: monospace;" th:text="${s.sku}"></td>
                    <td style="padding: 0.75rem 1rem; font-weight: 600;" th:text="${s.productName}"></td>
                    <td style="padding: 0.75rem 1rem; text-align: right;">
                        <span class="badge badge-paid" style="font-size: 0.9rem;" th:text="${s.quantity}"></span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(stocks)}">
                    <td colspan="4" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        No stock records yet. Use the adjustment form above or record purchases.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
