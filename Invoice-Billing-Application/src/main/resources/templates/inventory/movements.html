<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Stock Movements Audit Trail - SwiftLab</title>
</head>
<body>
<div th:fragment="content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin: 0;">Stock Movements Ledger</h1>
            <p style="color: var(--text-muted); margin: 0.25rem 0 0 0; font-size: 0.9rem;">
                Immutable audit ledger recording every inventory modification across all devices.
            </p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <a th:href="@{/inventory}" class="btn btn-secondary btn-sm">&larr; Back to Inventory</a>
        </div>
    </div>

    <div style="background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden;">
        <table class="table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
            <thead>
                <tr style="border-bottom: 1px solid var(--border-color); background: var(--bg-hover); text-align: left;">
                    <th style="padding: 0.75rem 1rem;">Timestamp</th>
                    <th style="padding: 0.75rem 1rem;">Warehouse</th>
                    <th style="padding: 0.75rem 1rem;">Product</th>
                    <th style="padding: 0.75rem 1rem;">Type</th>
                    <th style="padding: 0.75rem 1rem; text-align: right;">Quantity</th>
                    <th style="padding: 0.75rem 1rem;">Reference</th>
                    <th style="padding: 0.75rem 1rem;">Device ID</th>
                    <th style="padding: 0.75rem 1rem;">Notes</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${movements}" style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 0.75rem 1rem; color: var(--text-muted);" th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td style="padding: 0.75rem 1rem;" th:text="${m.warehouseName}"></td>
                    <td style="padding: 0.75rem 1rem;">
                        <span th:text="${m.productName}" style="font-weight: 600;"></span>
                        <span style="font-size: 0.75rem; color: var(--text-muted); font-family: monospace;" th:text="${' (' + m.productSku + ')'}"></span>
                    </td>
                    <td style="padding: 0.75rem 1rem;">
                        <span class="badge" th:classappend="${m.movementType.name() == 'STOCK_IN' || m.movementType.name() == 'PURCHASE' || m.movementType.name() == 'RETURN' ? 'badge-paid' : 'badge-overdue'}" th:text="${m.movementType}"></span>
                    </td>
                    <td style="padding: 0.75rem 1rem; text-align: right; font-weight: 700;" th:text="${m.quantity}"></td>
                    <td style="padding: 0.75rem 1rem; font-family: monospace;" th:text="${m.referenceType != null ? m.referenceType + ' #' + m.referenceId : '-'}"></td>
                    <td style="padding: 0.75rem 1rem; font-size: 0.75rem; font-family: monospace;" th:text="${m.deviceId}"></td>
                    <td style="padding: 0.75rem 1rem; color: var(--text-muted);" th:text="${m.notes}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(movements)}">
                    <td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">
                        No stock movements recorded yet.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
